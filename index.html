<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><title>Jujubinha Reells</title><style>*{box-sizing:border-box}body{margin:0;background:#020b17;color:#fff;font:15px system-ui}.app{max-width:560px;margin:auto;min-height:100vh;background:#061a33}.top{position:fixed;z-index:5;top:0;width:min(560px,100%);padding:14px;background:#061a33f4;display:flex;justify-content:space-between}.top b,.letter{color:#ffd52e}.feed{height:100vh;overflow:auto;scroll-snap-type:y mandatory}.q{min-height:100vh;scroll-snap-align:start;padding:76px 18px 86px;display:flex;flex-direction:column;justify-content:center}.tag{color:#75c9ff;font-weight:800;font-size:12px}.topic{color:#aabbd0;margin:6px 0 15px}.q h1{font-size:22px;line-height:1.3}.opt,.card{border-radius:14px}.opt{border:1px solid #24517c;background:#0b2848;color:#fff;padding:14px;text-align:left;margin:6px 0}.opt.ok{background:#0d6b46;border:2px solid #43e09d}.opt.no{background:#7a2635;border:2px solid #ff7188}.opt:disabled{opacity:1;color:#fff}.feedback{margin-top:12px;background:#0d2948;padding:14px;border-radius:14px}.hidden{display:none}.panel{padding:72px 16px 90px}.card{background:#0b2848;border:1px solid #24517c;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric strong{font-size:24px;display:block}nav{position:fixed;z-index:6;bottom:0;width:min(560px,100%);display:flex;justify-content:space-around;background:#061a33f5;border-top:1px solid #234667;padding:8px}nav button{background:none;border:0;color:#aabbd0;font-size:11px}nav button.on{color:#fff}.filter{position:fixed;z-index:4;top:47px;width:min(560px,100%);display:flex;gap:5px;padding:6px 10px;background:#061a33f4}.filter button{flex:1;border:1px solid #24517c;background:#0b2848;color:#ddd;padding:7px 2px;border-radius:10px;font-size:11px}.filter button.on{background:#ffd52e;color:#07182e;font-weight:900}.primary{width:100%;padding:13px;background:#ffd52e;border:0;border-radius:14px;font-weight:900}</style></head><body><div class="app"><div class="top"><b>JUJUBINHA REELLS</b><small>Inglês • História • Artes</small></div><div id="filter" class="filter"><button class="on" onclick="setSub('Todas',this)">Todas</button><button onclick="setSub('Inglês',this)">Inglês</button><button onclick="setSub('História',this)">História</button><button onclick="setSub('Artes',this)">Artes</button></div><main id="feed" class="feed"></main><section id="subjects" class="panel hidden"><h2>📚 Matérias</h2><div id="subjectList"></div></section><section id="stats" class="panel hidden"><h2>📊 Desempenho</h2><div class="grid"><div class="card metric"><strong id="answered">0</strong>respondidas</div><div class="card metric"><strong id="correct">0</strong>acertos</div><div class="card metric"><strong id="rate">0%</strong>aproveitamento</div><div class="card metric"><strong id="remaining">0</strong>a resolver</div></div><button class="primary" onclick="resetAll()">Zerar progresso</button></section><section id="more" class="panel hidden"><h2>☰ Mais</h2><div class="card"><h3>🎯 Banco</h3><p id="bank"></p></div><div class="card"><h3>📖 Base do conteúdo</h3><p>Questões elaboradas a partir dos materiais de Recuperação enviados: Inglês, História e Artes.</p></div></section><nav><button id="nf" class="on" onclick="tab('feed')">🎬<br>Reells</button><button id="ns" onclick="tab('subjects')">📚<br>Matérias</button><button id="nt" onclick="tab('stats')">📊<br>Desempenho</button><button id="nm" onclick="tab('more')">☰<br>Mais</button></nav></div><script src="questions.js"></script><script>let sub='Todas',key='recuperacao-shorts-v1',state=JSON.parse(localStorage.getItem(key)||'{}');function save(){localStorage.setItem(key,JSON.stringify(state))}function filtered(){return QUESTIONS.filter(q=>sub==='Todas'||q.subject===sub)}function render(){let f=document.getElementById('feed');f.innerHTML='';filtered().forEach(q=>{let id=QUESTIONS.indexOf(q),s=state[id],d=document.createElement('article');d.className='q';d.innerHTML=`<div class="tag">${q.subject}</div><div class="topic">${q.topic} • Questão ${id+1}/${QUESTIONS.length}</div><h1>${q.stem}</h1>`+q.options.map((o,j)=>`<button class="opt ${s?j===q.answer?'ok':(j===s.choice&&j!==q.answer?'no':''):''}" ${s?'disabled':''} onclick="answer(${id},${j})"><span class="letter">${String.fromCharCode(65+j)})</span> ${o}</button>`).join('')+(s?`<div class="feedback"><b>${s.choice===q.answer?'✅ Correto':'❌ Incorreto'}</b><br>${q.explanation}</div>`:'');f.appendChild(d)});updateStats()}function answer(id,c){if(state[id])return;state[id]={choice:c,ok:c===QUESTIONS[id].answer};save();render()}function setSub(s,b){sub=s;document.querySelectorAll('.filter button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();feed.scrollTop=0}function updateStats(){let v=Object.values(state),a=v.length,c=v.filter(x=>x.ok).length;answered.textContent=a;correct.textContent=c;rate.textContent=a?Math.round(c/a*100)+'%':'0%';remaining.textContent=QUESTIONS.length-a;bank.textContent=`${QUESTIONS.length} questões: ${QUESTIONS.filter(x=>x.subject==='Inglês').length} de Inglês, ${QUESTIONS.filter(x=>x.subject==='História').length} de História e ${QUESTIONS.filter(x=>x.subject==='Artes').length} de Artes.`;subjectList.innerHTML=['Inglês','História','Artes'].map(s=>{let ids=QUESTIONS.map((q,i)=>q.subject===s?i:null).filter(i=>i!==null),done=ids.filter(i=>state[i]).length,ok=ids.filter(i=>state[i]?.ok).length;return `<div class="card"><b>${s}</b><p>${done}/${ids.length} respondidas • ${done?Math.round(ok/done*100):0}% de acertos</p></div>`}).join('')}function tab(t){['feed','subjects','stats','more'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==t));filter.classList.toggle('hidden',t!=='feed');[['nf','feed'],['ns','subjects'],['nt','stats'],['nm','more']].forEach(([id,x])=>document.getElementById(id).classList.toggle('on',x===t));updateStats()}function resetAll(){if(confirm('Zerar todo o progresso?')){state={};save();render()}}render();</script></body></html>
